<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#C4D4DC">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Catch Up">
<title>Catch Up</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&family=Patrick+Hand&display=swap" rel="stylesheet">
<link rel="stylesheet" href="src/ui/style.css">
<script type="importmap">{ "imports": { "three": "./vendor/three.module.js" } }</script>
</head>
<body>
<main class="page">
  <div class="stage intro" id="stage">
    <canvas id="view" aria-label="Lakeside camp. Two friends sit in camp chairs by a lake with a chess board on a stump between them."></canvas>
    <div class="paper"></div><div class="vignette"></div><div class="veil"></div><div class="fx fx-a"></div><div class="fx fx-b"></div>
    <span class="tag" id="viewTag"></span>
    <div class="caption" id="caption" aria-live="polite"><b id="capWho"></b><span id="capText"></span></div>
    <button class="chip" id="panChip" type="button"></button>
    <div id="intro">
      <div class="logo"><h1>Catch Up</h1><p>Cozy chess by the fishing hole</p></div>
      <nav class="menu" aria-label="Main menu">
        <button class="mbtn" id="mSingle" type="button">Single player</button>
        <button class="mbtn" type="button" disabled>Invite a friend <small>soon</small></button>
        <div class="mrow"><button class="mbtn" id="mGallery" type="button">Gallery</button><button class="mbtn" id="mSettings" type="button">Settings</button></div>
      </nav>
    </div>
    <div class="pick" id="pick" hidden>
      <div class="ptitle">Pick your player</div><div class="psub">Who are you today?</div>
      <button class="pk" id="pickLiam" type="button">Liam</button>
      <button class="pk" id="pickXiao" type="button" disabled aria-label="Xiao, coming later">Xiao <small>&middot; coming later</small></button>
      <button class="mbtn pback" id="pickBack" type="button">Back</button>
    </div>
    <div class="catch" id="catch" role="dialog" aria-labelledby="catchTitle" hidden>
      <div id="catchFish"></div><h3 id="catchTitle"></h3><p id="catchMeta"></p>
      <div class="names" id="catchNames" role="group" aria-label="Suggested names"></div>
      <form id="nameForm"><input id="nameIn" type="text" maxlength="16" placeholder="Or type a name" aria-label="Fish name" autocomplete="off"><button class="skip" type="submit">Name it</button></form>
      <div class="names"><button class="skip" id="catchSkip" type="button">Keep it as it is</button><button class="skip" id="catchRelease" type="button">Let it go</button></div>
    </div>
    <div class="msgs" id="msgs" aria-live="polite"></div>
    <button class="chip talk" id="talkBtn" type="button" hidden>Talk</button>
    <button class="nib" id="nib" type="button" hidden aria-label="Something is nibbling your line. Look at the water.">!</button>
    <div class="bchips" id="bchips" hidden><button class="chip mini" id="hintBtn" type="button">Any ideas?</button><button class="chip mini" id="undoBtn" type="button">Wait, take that back</button></div>
    <div class="hotlabel" id="hotLabel" hidden></div>
    <div class="wind" id="wind" hidden><i id="windFill"></i></div>
    <div class="tackle" id="tackle" role="dialog" aria-label="Tackle box" hidden><b>Tackle box</b><button type="button" id="tBait">Bait: easy does it</button><button type="button" id="tLure">Lure: they fight back</button></div>
    <button class="chip swap" id="swapBtn" type="button" hidden></button>
    <div class="topright" id="topRight" hidden><button class="gear fsbtn" id="fsBtn" type="button" aria-label="Full screen" title="Full screen" hidden><svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path id="fsPath" d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/></svg></button><button class="nowplay" id="nowPlay" type="button" title="Next track"><span class="npnote" aria-hidden="true">&#9834;</span><span id="npName"></span></button><button class="gear" id="gearBtn" type="button" aria-label="Settings" title="Settings"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button></div>
    <div class="fight" id="fight" hidden aria-live="polite">
      <div class="fhint"><span id="fwho">Keep the fish in the light</span> &nbsp;<small>(mouse, touch, or arrow keys)</small></div>
      <div class="fbar" id="fbar"><div class="fzone" id="fzone"></div><div class="ffish" id="ffish"></div></div>
      <div class="fprog"><div id="fprog"></div></div>
    </div>
    <div class="dial" id="dial" hidden aria-label="Time of day" role="slider" tabindex="0" aria-valuemin="0" aria-valuemax="24">
      <div class="dring"></div><div class="dknob" id="dknob"></div><div class="dlabel" id="dlabel"></div>
    </div>
    <div class="toast" id="toast" role="status" hidden></div>
    <button class="qbtn" id="galBack" type="button" hidden>&lsaquo; Back</button>
    <div class="galnote" id="galNote" hidden></div>
    <div class="catch" id="fishInfo" role="dialog" aria-labelledby="fiTitle" hidden><div id="fiArt"></div><h3 id="fiTitle"></h3><p id="fiMeta"></p><button class="skip" id="fiClose" type="button">Close</button></div>
    <div class="settings" id="settings" role="dialog" aria-labelledby="setTitle" hidden>
      <h2 id="setTitle">Settings</h2>
      <section><h3>Day and night</h3>
        <label class="srow"><input type="checkbox" id="sCycle"> Time passes</label>
        <label class="srow"><span>Day length</span><input type="range" id="sLen" min="2" max="30" step="1"><output id="sLenOut"></output></label>
      </section>
      <section><h3>Sound</h3>
        <label class="srow"><input type="checkbox" id="sMute"> Mute everything</label>
        <label class="srow"><input type="checkbox" id="sRadio"> Radio on</label>
        <label class="srow"><span>Music</span><input type="range" id="sMusic" min="0" max="1" step="0.05"><output id="sMusicOut"></output></label>
        <label class="srow"><span>Effects</span><input type="range" id="sSfx" min="0" max="1" step="0.05"><output id="sSfxOut"></output></label>
        <label class="srow"><span>Ambience</span><input type="range" id="sAmb" min="0" max="1" step="0.05"><output id="sAmbOut"></output></label>
        <label class="srow"><span>Track</span><select id="sTrack"></select></label>
        <label class="srow"><span>Playback</span><select id="sMode"><option value="all">Play all tracks</option><option value="one">Repeat this track</option></select></label>
      </section>
      <section><h3>Campfire</h3>
        <label class="srow"><span>Fire</span><select id="sFire"><option value="auto">Lights at dusk</option><option value="always">Always lit</option><option value="off">Off</option></select></label>
      </section>
      <section><h3>Fishing &amp; chess</h3>
        <label class="srow"><input type="checkbox" id="sChallenge"> Reel-in challenge: follow the fish along a bar</label>
        <label class="srow"><input type="checkbox" id="sAdapt"> Let them match your level</label>
        <label class="srow"><span>Friend's chess strength</span><input type="range" id="sChess" min="0.05" max="1" step="0.05"><output id="sChessOut"></output></label>
      </section>
      <section><h3>Screen</h3>
        <label class="srow"><span>Filter</span><select id="sFilter"><option value="none">None</option><option value="dreamy">Dreamy drift</option><option value="film">Old film</option><option value="crt">CRT</option><option value="paper">Watercolour paper</option></select></label>
      </section>
      <section><h3>Camera</h3>
        <label class="srow"><input type="checkbox" id="sSway"> Gentle sway</label>
        <label class="srow"><input type="checkbox" id="sTilt"> Head tilt when looking at the board</label>
      </section>
      <section id="sTrip"><h3>This trip</h3>
        <div class="srow"><button class="tbtn" id="sNew" type="button">New game</button></div>
        <div class="srow sask" id="sNewAsk" hidden><span id="sNewQ"></span><button class="tbtn" id="sNewYes" type="button">Start over</button><button class="tbtn" id="sNewNo" type="button">Keep going</button></div>
      </section>
      <button class="mbtn" id="setClose" type="button">Done</button>
    </div>
    <button class="qbtn" id="quitBtn" type="button" hidden>&lsaquo; Quit</button>
    <div class="fade" id="fade"></div>
  </div>
</main>
<script type="module" src="src/main.js"></script>
</body>
</html>
